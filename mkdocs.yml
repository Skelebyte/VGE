site_name: VGE Documentation
site_url: https://vge.readthedocs.io
repo_url: https://github.com/Skelebyte/VGE

nav:
  - Home: index.md
  - "API":
    - "Structs":
        - "Memory": api/structs/Memory.md
        - "Pointer": api/structs/Pointer.md
    - "Macros":
        - "Malloc": api/macros/Malloc.md
        - "Free": api/macros/Free.md

theme:
  name: material
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
